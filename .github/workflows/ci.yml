name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A release (release.yml) roda este mesmo CI no commit da tag antes de publicar (tarefa 078).
  workflow_call:

# O GITHUB_TOKEN só lê o repositório (tarefa 184).
permissions:
  contents: read

# Só o PR cancela a execução anterior: no main e na tag cada commit fica com o seu resultado (tarefa 184).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions fixadas pelo SHA do commit, com a versão no comentário (tarefa 184; o Dependabot as atualiza). O Node vem do
# .nvmrc (tarefa 187), e scripts/check-versions.mjs confere tudo isso no job check.
jobs:
  check:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Falha com alerta alto ou crítico numa dependência de produção (tarefa 071).
      - name: Alertas de segurança das dependências
        run: pnpm audit --prod --audit-level high
      - name: Versões fixas (Node, actions e imagens)
        run: node scripts/check-versions.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      # Com a cobertura do v8 (tarefa 126): o resumo vai para o resumo do job no passo "Cobertura", ainda sem piso.
      - name: Testes unitários (shared e scripts)
        run: pnpm --filter @moneyflow/shared test:coverage && pnpm test:scripts
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A imagem do banco sai do cache do GitHub, a mesma nos três jobs (tarefa 184); o Testcontainers a usa pronta.
      - name: Imagem do banco
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: database
          file: database/docker/Dockerfile
          load: true
          tags: moneyflow-postgres:dev
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max
      - name: Testes de integração da API (Postgres 18 real via Testcontainers)
        run: pnpm --filter @moneyflow/server test:coverage
        env:
          MONEYFLOW_TEST_PG_IMAGE: moneyflow-postgres:dev
      - name: Cobertura (server e shared)
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm build

  database:
    name: Banco (pgTAP e referências geradas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Imagem do banco
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: database
          file: database/docker/Dockerfile
          load: true
          tags: moneyflow-postgres:dev
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max
      - run: make -C database test
      # A referência commitada tem de bater com as migrations (tarefa 163): migration nova sem `make dump` falha aqui.
      - name: schema.sql e privileges.sql em dia com as migrations
        run: |
          make -C database dump
          git diff --exit-code database/schema.sql database/privileges.sql
      - if: always()
        run: docker compose -f database/docker-compose.yml down -v

  image:
    name: Imagem Docker e E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [check]
    env:
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@moneyflow.local
      ADMIN_PASSWORD: ci-admin-password
      # Bot API falsa do e2e de mensagens (sobe no runner; a pilha a alcança por host.docker.internal)
      TELEGRAM_API_BASE: http://host.docker.internal:18081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build da imagem (sem push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tmsoftbrasil/moneyflow:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Já carregada, o compose não a constrói de novo (sobe sem --build).
      - name: Imagem do banco
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: database
          file: database/docker/Dockerfile
          load: true
          tags: moneyflow-postgres:dev
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max
      - name: Sobe a pilha (banco, migrations, api, worker)
        run: docker compose up -d --wait api worker
      - name: Login do admin e SPA
        run: |
          curl -fsS http://localhost:3000/api/health
          curl -fsS -c /tmp/cj -H 'content-type: application/json' \
            -d "{\"login\":\"$ADMIN_USERNAME\",\"password\":\"$ADMIN_PASSWORD\"}" http://localhost:3000/api/auth/login
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moneyflow/e2e exec playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
      - if: always()
        run: |
          docker compose logs api worker migrate | tail -200
          docker compose down -v
