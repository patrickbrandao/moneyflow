name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Testes unitários (shared)
        run: pnpm test:unit
      - name: Testes de integração da API (Postgres 18 real via Testcontainers)
        run: pnpm test:integration
      - run: pnpm build

  database:
    name: Banco (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C database test
      - if: always()
        run: docker compose -f database/docker-compose.yml down -v

  image:
    name: Imagem Docker e E2E
    runs-on: ubuntu-latest
    needs: [check]
    env:
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@moneyflow.local
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tmsoftbrasil/moneyflow:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sobe a pilha (banco, migrations, api, worker)
        run: docker compose up -d --wait api worker
      - name: Login do admin e SPA
        run: |
          curl -fsS http://localhost:3000/api/health
          curl -fsS -c /tmp/cj -H 'content-type: application/json' \
            -d "{\"login\":\"$ADMIN_USERNAME\",\"password\":\"$ADMIN_PASSWORD\"}" http://localhost:3000/api/auth/login
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moneyflow/e2e exec playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
      - if: always()
        run: |
          docker compose logs api worker migrate | tail -200
          docker compose down -v
