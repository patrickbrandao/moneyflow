name: Release

# Tag v* → imagem multi-arch (amd64 + arm64) tmsoftbrasil/moneyflow:X.Y.Z e, só se a tag for a maior versão, :latest.
# Antes do build, o CI inteiro (ci.yml: lint, typecheck, testes, pgTAP, imagem e e2e) roda no commit da tag; a imagem
# só sai se ele passar (tarefa 078). O login e o push só acontecem se os secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN
# existirem; sem eles o workflow só valida o build.

on:
  push:
    tags: ['v*']

# O GITHUB_TOKEN só lê o repositório; o push vai ao Docker Hub com o secret (tarefa 184).
permissions:
  contents: read

jobs:
  ci:
    name: CI no commit da tag
    uses: ./.github/workflows/ci.yml

  image:
    name: Imagem multi-arch
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # As tags, para saber se esta é a maior versão.
          fetch-depth: 0
      - name: A tag é a versão do package.json e a maior?
        id: version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não é a versão do package.json ($version)."
            exit 1
          fi
          newest="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)"
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then latest=true; else latest=false; fi
          [ "$latest" = true ] || echo "::notice::$GITHUB_REF_NAME não é a maior tag ($newest): o :latest fica onde está."
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: tmsoftbrasil/moneyflow
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest }}
      - if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: env.HAS_DOCKERHUB != 'true'
        run: echo "::warning::Secrets DOCKERHUB_USERNAME/DOCKERHUB_TOKEN ausentes; a imagem é construída, mas não publicada."
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.HAS_DOCKERHUB == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM e proveniência completa junto da imagem publicada (tarefa 184).
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
