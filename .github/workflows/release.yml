name: Release

# Tag v* → imagem multi-arch (amd64 + arm64) tmsoftbrasil/moneyflow:X.Y.Z e :latest.
# O login e o push só acontecem se os secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN existirem;
# sem eles o workflow só valida o build.

on:
  push:
    tags: ['v*']

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: tmsoftbrasil/moneyflow
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: env.HAS_DOCKERHUB != 'true'
        run: echo "::warning::Secrets DOCKERHUB_USERNAME/DOCKERHUB_TOKEN ausentes; a imagem é construída, mas não publicada."
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.HAS_DOCKERHUB == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
