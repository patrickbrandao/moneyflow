# Pilha completa do MoneyFlow: Postgres (de database/), migrations (one-shot),
# API (que serve o SPA) e worker, todos da imagem única tmsoftbrasil/moneyflow.
#   docker compose up --build -d     → http://localhost:${APP_PORT:-3000}
# O banco desta pilha tem volume próprio e sai em STACK_DB_PORT (5433), separado
# do banco de desenvolvimento de database/ (5432).
name: moneyflow

include:
  - path:
      - database/docker-compose.yml
      - docker/database.override.yml

x-app: &app
  image: ${MONEYFLOW_IMAGE:-tmsoftbrasil/moneyflow:dev}
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgres://moneyflow_app:${APP_DB_PASSWORD:-moneyflow_app}@postgres:5432/${POSTGRES_DB:-moneyflow}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    TZ: America/Sao_Paulo
    # Bot API do Telegram (spec 013). Nos e2e, aponte para a Bot API falsa do Playwright:
    # TELEGRAM_API_BASE=http://host.docker.internal:18081 docker compose up -d
    TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
    APP_URL: ${APP_URL:-}
    # Telegram de entrada (spec 029): URL pública HTTPS da API para o webhook (app_settings telegram.public_base_url vence).
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    # Requisições ao provedor de IA (spec 023): tentativas por chamada e a retenção padrão (dias), na API e no worker.
    AI_REQUEST_MAX_ATTEMPTS: ${AI_REQUEST_MAX_ATTEMPTS:-3}
    AI_REQUEST_RETENTION_DAYS: ${AI_REQUEST_RETENTION_DAYS:-30}
    # Chat multimídia (spec 025): espera da execução pelas transcrições pendentes (ms).
    AI_TRANSCRIPTION_TIMEOUT_MS: ${AI_TRANSCRIPTION_TIMEOUT_MS:-120000}
    # Limite de execuções de IA por minuto por usuário (spec 028); o valor salvo na tela (app_settings) vence.
    AI_RUNS_PER_MINUTE: ${AI_RUNS_PER_MINUTE:-10}
    AI_FLOW_RUNS_PER_MINUTE: ${AI_FLOW_RUNS_PER_MINUTE:-30}
  # host.docker.internal também no Linux (a Bot API falsa dos e2e roda no host).
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  # Aplica as migrations (dbmate) antes da API e do worker, como o dono do banco SEM superusuário
  # (moneyflow_owner, criado pelo initdb; tarefa 054). Migration rodada pelo superusuário deixa objetos dele, e a
  # restauração do dump pelo dono falha. Volume antigo: rode uma vez
  #   docker compose exec postgres bash /docker-entrypoint-initdb.d/03-owner-role.sh
  # (idempotente) antes de subir esta versão.
  # A versão do dbmate é a de database/docker-compose.yml (tarefa 163; scripts/check-versions.mjs confere), e o
  # lock_timeout de 10 s é o mesmo (tarefa 102): a migration que não consegue o lock falha em vez de enfileirar a API.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.38.2
    command: ["--wait", "--wait-timeout", "60s", "up"]
    environment:
      DATABASE_URL: postgres://moneyflow_owner:${OWNER_DB_PASSWORD:-moneyflow_owner}@postgres:5432/${POSTGRES_DB:-moneyflow}?sslmode=disable&options=-c%20lock_timeout%3D10s
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_STRICT: "true"
    volumes:
      - ./database/migrations:/db/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    # Consulta de CNPJ no CNPJ Aberto (spec 003): CNPJ_ABERTO_ENABLED e CNPJ_ABERTO_API_KEY vêm deste
    # arquivo local, fora do git (sem ele, a consulta usa só a BrasilAPI).
    env_file:
      - path: .local/cnpjaberto.env
        required: false
    environment:
      <<: *app-env
      MODE: api
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      # Ociosidade máxima da sessão em horas (0 desliga; docs/002).
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-72}
      LOOKUP_TIMEOUT_MS: ${LOOKUP_TIMEOUT_MS:-5000}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      # Proxies que podem informar o IP do cliente (X-Forwarded-For); vazio = nenhum (docs/002).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      AI_DOCUMENT_TIMEOUT_MS: ${AI_DOCUMENT_TIMEOUT_MS:-120000}
      # Backup e restauração (spec 019): o dump e a restauração do banco usam a conexão do DONO do banco
      # (pg_dump/pg_restore/psql; a aplicação continua como moneyflow_app). Vazia = dump desligado. O dono é o
      # moneyflow_owner, sem SUPERUSER/CREATEROLE/CREATEDB (tarefa 054, docs/016), nunca o superusuário da imagem.
      DATABASE_OWNER_URL: postgres://moneyflow_owner:${OWNER_DB_PASSWORD:-moneyflow_owner}@postgres:5432/${POSTGRES_DB:-moneyflow}?sslmode=disable
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-512}
    ports:
      - "${APP_PORT:-3000}:3000"

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-env
      MODE: worker
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-3600000}
      CARD_AUTO_CLOSE: ${CARD_AUTO_CLOSE:-false}
      MESSAGE_INTERVAL_MS: ${MESSAGE_INTERVAL_MS:-30000}
      NOTIFY_AT: ${NOTIFY_AT:-08:00}
      AGENT_POLL_MS: ${AGENT_POLL_MS:-1000}
      AGENT_CONCURRENCY: ${AGENT_CONCURRENCY:-4}
      AGENT_MAINTENANCE_MS: ${AGENT_MAINTENANCE_MS:-300000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
