# Pilha completa do MoneyFlow: Postgres (de database/), migrations (one-shot),
# API (que serve o SPA) e worker, todos da imagem única tmsoftbrasil/moneyflow.
#   docker compose up --build -d     → http://localhost:${APP_PORT:-3000}
# O banco desta pilha tem volume próprio e sai em STACK_DB_PORT (5433), separado
# do banco de desenvolvimento de database/ (5432).
name: moneyflow

include:
  - path:
      - database/docker-compose.yml
      - docker/database.override.yml

x-app: &app
  image: ${MONEYFLOW_IMAGE:-tmsoftbrasil/moneyflow:dev}
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgres://moneyflow_app:${APP_DB_PASSWORD:-moneyflow_app}@postgres:5432/${POSTGRES_DB:-moneyflow}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    TZ: America/Sao_Paulo
    # Bot API do Telegram (spec 013). Nos e2e, aponte para a Bot API falsa do Playwright:
    # TELEGRAM_API_BASE=http://host.docker.internal:18081 docker compose up -d
    TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
    APP_URL: ${APP_URL:-}
    # Agentes de IA (spec 011): agente dos fluxos (leitura de documento, sugestões da conciliação), pelo nome;
    # vazio = o primeiro agente ativo.
    AI_FLOW_AGENT: ${AI_FLOW_AGENT:-}
  # host.docker.internal também no Linux (a Bot API falsa dos e2e roda no host).
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  # Aplica as migrations (dbmate, como dono do banco) antes da API e do worker.
  migrate:
    image: ghcr.io/amacneil/dbmate:2
    command: ["--wait", "--wait-timeout", "60s", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-moneyflow}:${POSTGRES_PASSWORD:-moneyflow}@postgres:5432/${POSTGRES_DB:-moneyflow}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_STRICT: "true"
    volumes:
      - ./database/migrations:/db/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    # Consulta de CNPJ no CNPJ Aberto (spec 003): CNPJ_ABERTO_ENABLED e CNPJ_ABERTO_API_KEY vêm deste
    # arquivo local, fora do git (sem ele, a consulta usa só a BrasilAPI).
    env_file:
      - path: .local/cnpjaberto.env
        required: false
    environment:
      <<: *app-env
      MODE: api
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      LOOKUP_TIMEOUT_MS: ${LOOKUP_TIMEOUT_MS:-5000}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      AI_DOCUMENT_TIMEOUT_MS: ${AI_DOCUMENT_TIMEOUT_MS:-120000}
    ports:
      - "${APP_PORT:-3000}:3000"

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-env
      MODE: worker
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-3600000}
      CARD_AUTO_CLOSE: ${CARD_AUTO_CLOSE:-false}
      MESSAGE_INTERVAL_MS: ${MESSAGE_INTERVAL_MS:-30000}
      NOTIFY_AT: ${NOTIFY_AT:-08:00}
      AGENT_POLL_MS: ${AGENT_POLL_MS:-1000}
      AGENT_CONCURRENCY: ${AGENT_CONCURRENCY:-4}
      AGENT_MAINTENANCE_MS: ${AGENT_MAINTENANCE_MS:-300000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
