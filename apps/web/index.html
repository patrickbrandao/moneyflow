<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MoneyFlow</title>

    <script>
      // Aplica o tema salvo ANTES da primeira pintura, para a tela não piscar.
      // A chave precisa ser a mesma de `THEME_STORAGE_KEY` em src/config/brand.ts.
      (() => {
        var root = document.documentElement;
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('moneyflow:theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch (e) {
          /* storage bloqueado: fica no padrão */
        }
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
